<div class="container mt-4">

  <!-- Title -->
  <div class="mb-4">
    <h4 class="fw-bold text-primary">Gross Margin</h4>
    <hr class="mt-2">
  </div>

  <div class="row g-4">

    <!-- LEFT CARD -->
    <div class="col-lg-6">
      <div class="card gm-card h-100">

        <div class="card-header bg-white border-0 pb-0">
        <h5 class="fw-bold text-primary mb-1 d-flex align-items-center gap-2">
  <i class="bi bi-building"></i>
  Accrual File Upload

  <i class="bi bi-download ms-2 text-success"
     style="cursor: pointer;"
     title="Download"
     >
     <img (click)="AccouralTemplateDownload()" src="assets/download_enabled.svg">
  </i>
</h5>
          
        </div>

        <div class="card-body">

          <!-- Company -->
          <div class="mb-2">
            <label class="form-label gm-label">Company Code</label>
            <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
          </div>

          <!-- Pay Period -->
          <div class="mb-2">
            <label class="form-label gm-label">Pay Period</label>
            <PayPeriod
              [selectedCompanyId]="selectedCompanyId"
              [payPeriodType]="payPeriodType"
              (payperiodEmit)="handlePayperiodEvent($event)">
            </PayPeriod>
          </div>
<div class="upload-box"
     (dragover)="onDragOver($event)"
     (dragleave)="onDragLeave($event)"
     (drop)="onDrop($event)"
     [class.dragging]="isDragging">

  <!-- If NO file -->
  <div *ngIf="!selectedFile" class="text-center">

    <i class="bi bi-cloud-upload upload-icon"></i>

    <p class="mb-1 fw-semibold">
      Drag & Drop file here
    </p>

    <small class="text-muted d-block mb-2">
      or click to browse
    </small>

    <input type="file"
           (change)="onFileSelected($event)"
           hidden
           #fileInput>

    <button class="btn btn-outline-primary btn-sm"
            (click)="fileInput.click()">
      Browse File
    </button>
  </div>

  <!-- If file selected -->
  <div *ngIf="selectedFile" class="file-preview">

    <div class="d-flex align-items-center justify-content-between">

      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-file-earmark-text file-icon"></i>

        <div>
          <div class="fw-semibold small">
            {{ selectedFile.name }}
          </div>
          <small class="text-muted">
            {{ selectedFile.size / 1024 | number:'1.0-0' }} KB
          </small>
        </div>
      </div>

      <button class="btn btn-sm btn-danger"
              (click)="removeFile()">
        ✕
      </button>
    </div>

  </div>
</div>

<!-- Upload Button -->
<button style="width: 100px;margin-top: 2px;"
  class="btn gm-btn-upload w-100"
  (click)="uploadFile()"
  [disabled]="!selectedFile">

  <span class="d-flex align-items-center justify-content-center gap-2">
    <i class="bi bi-cloud-arrow-up"></i>
    Upload File
  </span>

</button>
      

        </div>
      </div>
    </div>


    <!-- RIGHT CARD -->
    <div class="col-lg-6">
      <div class="card gm-card h-100">

        <div class="card-header bg-white border-0 pb-0">
          <h6 class="fw-bold text-success mb-1">
            <i class="bi bi-upload me-2"></i>
            Reports
          </h6>
        
        </div>

        <div class="card-body d-flex flex-column">

          <!-- Pay Period -->
          <div class="mb-3">
            <label class="form-label gm-label">Pay Period</label>
             <payperiodall (FrequencyEmit)="handleFrequencyEvent($event)">
                       
                    </payperiodall>
          </div>
      <div class="mb-3 d-flex gap-2">
        <button style="width: 120px;" class="btn gm-btn-upload" (click)="downloadReport()">
          <span class="d-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-cloud-arrow-up"></i>
            Gross Margin
          </span>
        </button>
      
        <button style="width: 120px;" class="btn gm-btn-upload" (click)="unprosseddownloadReport()">
          <span class="d-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-cloud-arrow-up"></i>
            Unprocessed
          </span>
        </button>
        <button style="width: 100px;" class="btn gm-btn-upload" (click)="unprosseddownloadReport()">
          <span class="d-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-cloud-arrow-up"></i>
            Freeze
          </span>
        </button>
      </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Loader -->
  <div *ngIf="isLoading" class="loading-overlay">
    <div class="text-center">
      <img src="assets/Loading.gif" width="60">
      <div class="mt-2 text-primary fw-semibold">Processing...</div>
    </div>
  </div>

</div>
