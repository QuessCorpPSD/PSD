<div class="container p-1">
<div class="row">
    <h2>Gross Margin</h2>
</div>
<div class="card-body">
 <div class="row">
        <div class="col-5">
            <label class="form-label text-muted small">Company Code</label>
            <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
        </div>
        <div class="col-4">
            <label class="form-label text-muted small">Pay Period</label>
            <PayPeriod [selectedCompanyId]="selectedCompanyId" [payPeriodType]="payPeriodType"
                (payperiodEmit)="handlePayperiodEvent($event)"></PayPeriod>
        </div>
         <div class="col-3 d-flex gap-2 py-1">
            <label class="form-label text-muted small"></label>
            <button (click)="downloadReport()" style="height: 35px;margin-top: 20px;"
                class="btn btn-primary btn-sm d-flex align-items-center justify-content-center">
                Download
            </button>
            <!-- <button  style="height: 35px;margin-top: 20px;" class="btn btn-primary btn-sm btn-xs d-flex align-items-center">
                Initiate
            </button> -->
           
        </div>
 </div>
</div>
<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets/Loading.gif">
</div>
</div>
