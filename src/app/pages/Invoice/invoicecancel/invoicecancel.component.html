<div class="container-fluid p-2 page-wrapper">

  <!-- FILTERS -->
  <div class="row g-2 align-items-end mb-2">
    <div class="col-3">
      <label class="form-label small">Company Code</label>
      <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
    </div>
    <div class="col-3">
      <label class="form-label small">Pay Period</label>
      <PayPeriod [selectedCompanyId]="selectedCompanyId" [payPeriodType]="payPeriodType"
        (payperiodEmit)="handlePayperiodEvent($event)">
      </PayPeriod>
    </div>
    <div class="col-auto d-flex gap-2">
      <button (click)="InvoiceSearch()"
        style="width: 80px; height: 30px; color: white;padding-left: 16px; padding-right: 16px; padding-top: 6px; padding-bottom: 6px; background: #302CB3; box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.20); border-radius: 6px; justify-content: center; align-items: center; gap: 10px; display: inline-flex; border: none;">
        <div
          style="color: var(--background, #F5F5F5); font-size: 12px; font-family: Nunito Sans; font-weight: 600; line-height: 22.40px; letter-spacing: 0.24px; word-wrap: break-word">
          Search</div>
      </button>
      <button (click)="invoiceApprove()"
        style="width: 120px; height: 30px; color: white;padding-left: 16px; padding-right: 16px; padding-top: 6px; padding-bottom: 6px; background: #302CB3; box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.20); border-radius: 6px; justify-content: center; align-items: center; gap: 10px; display: inline-flex; border: none;">
        <div
          style="color: var(--background, #F5F5F5); font-size: 12px; font-family: Nunito Sans; font-weight: 600; line-height: 22.40px; letter-spacing: 0.24px; word-wrap: break-word">
          Approve</div>
      </button>
      <button (click)="invoiceReject()"
        style="width: 100px; height: 30px; color: white;padding-left: 16px; padding-right: 16px; padding-top: 6px; padding-bottom: 6px; background: #302CB3; box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.20); border-radius: 6px; justify-content: center; align-items: center; gap: 10px; display: inline-flex; border: none;">
        <div
          style="color: var(--background, #F5F5F5); font-size: 12px; font-family: Nunito Sans; font-weight: 600; line-height: 22.40px; letter-spacing: 0.24px; word-wrap: break-word">
          Reject</div>
      </button>
      <!-- <button class="btn btn-primary" (click)="InvoiceSearch()">Search</button>
      <button class="btn btn-primary" (click)="invoiceApprove()">Approve</button>
      <button class="btn btn-primary" (click)="invoiceReject()">Reject</button> -->
      <input placeholder="Remarks" type="text" [(ngModel)]="remarkText" />
    </div>
  </div>

  <ag-grid-angular class="ag-theme-quartz" [pagination]="true" [paginationPageSize]="100" [rowData]="InvoiceCancelData"
    [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [domLayout]="'autoHeight'" [gridOptions]="gridOptions"
    [pagination]="true" [paginationPageSize]="pageSize" [paginationPageSizeSelector]="pageSizeOptions"
    (paginationChanged)="onPaginationChanged($event)" (gridReady)="onGridReady($event)">
  </ag-grid-angular>

  <!-- LOADING OVERLAY -->
  <div *ngIf="isLoading" class="loading-overlay">
    <img src="assets/Loading.gif" alt="Loading..." />
  </div>
  <div *ngIf="showPopup" class="overlay">
    <app-alertpopup *ngIf="showPopup" [message]="popupMessage" [submessage]="popupSubMessage" class="centered-popup"
      (close)="showPopup = false"></app-alertpopup>
  </div>
