        <ag-grid-angular class="ag-theme-quartz" [pagination]="true" [paginationPageSize]="100"
                [rowData]="BillingDasData" [columnDefs]="columnDefs" [defaultColDef]="defaultColDef"
                [domLayout]="'autoHeight'" [gridOptions]="gridOptions" [pagination]="true"
                [paginationPageSize]="pageSize" [paginationPageSizeSelector]="pageSizeOptions"

        </ag-grid-angular>

	<div *ngIf="iseditClicked" class="popup-overlay">
    <mat-card class="popup-card">
        <mat-card-header style="border-bottom: 1px solid #89898B; gap:400px; padding: 15px 15px 15px 15px">
            <mat-card-title style="color: #302CB3;">Change Assignment</mat-card-title>
            <button style="border: none; background: transparent;"><mat-icon (click)="closeclick()"
                    matTooltip="close">close</mat-icon></button>
        </mat-card-header>
        <mat-card-content class="scroll-content">
            <div class="row g-3 align-items-end">
                <div class="col-md-12" style="display: inline-block; padding-top:10px;">
                    <div
                        style="width: 100%; height: 12.35px; color: var(--text-field-heading-, #89898B); font-size: 12px; font-family: Nunito Sans; font-weight: 500; word-wrap: break-word">
                        Allotted To</div>
                    <div style="padding-top: 5px; padding-bottom: 10px;">
                        <input type="text" [value]="AllotedTo" readonly="true" />
                    </div>
                    <div
                        style="width: 160px; height: 12.35px; color: var(--text-field-heading-, #89898B); font-size: 12px; font-family: Nunito Sans; font-weight: 500; word-wrap: break-word">
                        Change To</div>
                    <div style="padding-top: 5px; padding-bottom: 15px;">
                        <user (userEmit)="handleuserEvent($event)"></user>
                    </div>
                </div>
            </div>
        </mat-card-content>

        <mat-card-actions class="right-align"
            style="display: flex; padding: 14px 20px; justify-content: flex-end; align-items: center; gap: 12px; align-self: stretch;border-radius: 0 0 10px 10px; border-top: 1px solid var(--Card-Box-border-color, #D6D6D6); background: var(--Card-card-background, white);">
            <button (click)="Save()"
                style="margin-right: 10px;width: 200px; height: 30px; padding-left: 16px; padding-right: 16px; padding-top: 6px; padding-bottom: 6px; background: #302CB3; box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.20); border-radius: 6px; justify-content: center; align-items: center; gap: 10px; display: inline-flex; border: none;">
                <div
                    style="color: var(--background, #F5F5F5); font-size: 12px; font-family: Nunito Sans; font-weight: 600; line-height: 22.40px; letter-spacing: 0.24px; word-wrap: break-word">
                    Save</div>
            </button>
        </mat-card-actions>
    </mat-card>
