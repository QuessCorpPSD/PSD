<div class="container-fluid">
  <div class="row">
    <div class="hm_contain">
      <div class="subheaders_page_blue">SEZWOP Repository</div>
      <div class="hm_subheaders_grey2"></div>

      <!-- Unified Form -->
      <div class="form-inline">

        <div class="form-group">
          <label class="Invoice_com">Financial Year:</label>
            <financial-year (financialEmit)="handlefinancialYearEvent($event)"></financial-year>
        </div>

        <div class="form-group">
          <label for="ddlCompanyCode">Company Code</label>
          <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
        </div>

        <div class="form-group">
          <label for="ddlPayPeriod">Pay Period</label>
          <PayPeriod [selectedCompanyId]="selectedCompanyId" [payPeriodType]="payPeriodType"
                        (payperiodEmit)="handlePayperiodEvent($event)"></PayPeriod>
        </div>

        <!-- Search Button -->
        <button type="button"
                class="btn size_90"
                id="GetCancelledInvoiceDocumentDetails"
                (click)="onSearch()">
          Search
        </button>

        <!-- Export Button -->
        <button type="button"
                id="exportLicensing"
                (click)="onExportToExcel()">
          Export to Excel
        </button>
      </div>

      <!-- Invoice Number -->
      <div class="invoice-search-row">
        <div class="invoice-label">
          <label for="txtInvoiceNumber">Invoice Number:</label>
        </div>
        <div class="invoice-input">
          <input type="text"
                 id="txtInvoiceNumber"
                 [(ngModel)]="invoiceNumber"
                 (input)="onInvoiceNumberInput()"
                 placeholder="Search by invoice number" />
        </div>
      </div>

      <!-- AG Grid -->
      <div class="grid_table_container">
        <!-- Toolbar -->
        <div class="grid-toolbar">
          <button type="button" class="btn size_90" (click)="onEditClick()">Edit</button>
          <button type="button" class="btn size_90" style="margin-left: 5px;" (click)="onDeleteClick()">Delete</button>
        </div>

        <ag-grid-angular
          class="ag-theme-alpine"
          [rowData]="rowData"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [rowSelection]="'multiple'"
          [pagination]="true"
          [paginationPageSize]="10"
          [animateRows]="true"
          [rowMultiSelectWithClick]="true"
          [suppressRowClickSelection]="false"
          [getRowId]=""
          (gridReady)="onGridReady($event)"
          (selectionChanged)="onSelectionChanged($event)"
          (cellClicked)="onCellClicked($event)"
          style="width: 100%; height: 500px;">
        </ag-grid-angular>
      </div>
    </div>
  </div>
</div>

<!-- Upload Popup (replaces jqxWindow #popupWindow) -->
<div class="modal-overlay" *ngIf="showUploadPopup" (click)="onCancelPopup()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <span>Upload Document Type</span>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-label">Remarks<span class="required">*</span></div>
        <div class="form-input">
          <input type="text"
                 id="txtRemarks"
                 class="form-control"
                 [(ngModel)]="uploadRemark" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-label">Document Upload<span class="required">*</span></div>
        <div class="form-input">
          <input type="file"
                 id="fileupload"
                 [accept]="acceptedFileTypes"
                 (change)="onFileSelected($event)" />
        </div>
      </div>

      <div class="form-row button-row">
        <button type="button" class="btn btn-submit" (click)="onSave()">Save</button>
        <button type="button" class="btn size_90" (click)="onCancelPopup()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- Validation Popup (replaces jqxWindow #Popvalidationwin) -->
<div class="modal-overlay" *ngIf="showValidationPopup" (click)="closeValidationPopup()">
  <div class="modal-content validation-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <span>Document Repository Pop Up Says</span>
    </div>
    <div class="modal-body validation-body">
      <ul>
        <li *ngFor="let msg of validationMessages" class="validation-error">{{ msg }}</li>
      </ul>
      <button type="button" class="btn size_90" (click)="closeValidationPopup()">OK</button>
    </div>
  </div>
</div>
