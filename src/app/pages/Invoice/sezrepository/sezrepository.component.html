<div class="container py-4">
    <div class="row five-col-row">
        <div class="col-custom">
            <label class="form-label">Financial Year</label>
            <financial-year></financial-year>
        </div>
        <div class="col-custom">
            <label class="form-label">Company</label>
            <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
        </div>
        <div class="col-custom">
            <label class="form-label">Pay Period</label>
            <PayPeriod [selectedCompanyId]="selectedCompanyId" [payPeriodType]="payPeriodType"
                (payperiodEmit)="handlePayperiodEvent($event)"></PayPeriod>
        </div>
        <div class="col-custom">
            <label class="form-label">Invoice Number search</label>
            <div class="search-box">
                <i style="margin-right: 6px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 12 12" fill="none">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M8.30883 9.01596C7.539 9.63177 6.5625 10 5.5 10C3.01472 10 1 7.98528 1 5.5C1 3.01472 3.01472 1 5.5 1C7.98528 1 10 3.01472 10 5.5C10 6.56251 9.63176.53901 9.01594 8.30885L10.8535 10.1465C11.0488 10.3417 11.0488 10.6583 10.8535 10.8536C10.6583 11.0488 10.3417 11.0488 10.1464 10.8536L8.30883 9.01596ZM2 5.5C2 3.567 3.567 2 5.5 2C7.433 2 9 3.567 9 5.5C9 6.44299 8.62707 7.29888 8.02066 7.92823C8.00355 7.94139 7.98711 7.95579 7.97144 7.97146C7.95578 7.98712 7.94137 8.00357 7.92822 8.02067C7.29887 8.62708 6.44299 9 5.5 9C3.567 9 2 7.433 2 5.5Z"
                            fill="#7E7E7E" />
                    </svg>
                </i>
                <input type="text" placeholder="Search Invoice Number" />
            </div>
        </div>
        <div class="col-custom d-flex align-items-end">
            <div class="d-flex gap-2">
    
                <button class="btn-custom">Search</button>
                <button class="btn-custom">Export</button>
    
            </div>
        </div>
    </div>
    <div class="card-body">

    </div>
</div>
