<form [formGroup]="addMenuForm" novalidate>
    <mat-card class="custom-card">
        <mat-card-header class="sticky-header">

            <mat-card-title style="color: #302CB3;">Add Company Permission</mat-card-title>
            <span class="spacer"></span>
            <button mat-icon-button (click)="onClose()" class="no-border-icon">
                <mat-icon>close</mat-icon>
            </button>
        </mat-card-header>

        <mat-card-content class="scroll-content">
            <br />
            <!-- Row 1 -->
            <div class="row g-3 mb-3">
                <div class="col-md-3">
                    <label class="form-label text-muted small">Employee Id</label>
                    <!-- <input type="text" class="form-control form-control-sm" formControlName="CompanyCode" /> -->
                    <select class="form-select form-select-sm" formControlName="EmployeeId">
                        <option value="">--Select--</option>
                        <!-- <option *ngFor="let pay of paytype" [value]="pay.PayType_Id">{{pay.PayType}}</option> -->
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small" n style="white-space: nowrap;">Business Unit
                        Name/Entity</label>
                    <select class="form-select form-select-sm" formControlName="BusinessUnitName/Entity">
                        <option value="">--Select--</option>
                        <!-- <option *ngFor="let pay of paytype" [value]="pay.PayType_Id">{{pay.PayType}}</option> -->
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Zone Name<span class="text-danger"></span></label>
                    <select class="form-select" formControlName="ZoneName">
                        <option value="">-- Select --</option>
                    </select>
                </div>
            </div>
        </mat-card-content>
        <mat-card-footer class="footer">
            <div class="d-flex justify-content-end mt-3">
                <div class="btn-1"
                    style="display: flex; justify-content: flex-end; gap: 10px; width: 100%; padding-right: 7px;">

                    <button type="Cancel"
                        style="border: none; border-radius: 7px; width: 80px; height: 30px; cursor: pointer; background-color: #f0f0f0; color: black;"
                        (click)="onClose()">
                        Cancel
                    </button>

                    <button type="submit"
                        style="border: none; border-radius: 7px; width: 80px; height: 30px; cursor: pointer; background-color: blue; color: white; "
                        (click)="Save()">
                        Save
                    </button>
                </div>
            </div>
        </mat-card-footer>
    </mat-card>
</form>
