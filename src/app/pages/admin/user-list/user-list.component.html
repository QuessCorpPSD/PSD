<div class="container p-2">
  <!-- Common Search -->
  <div class="table-header">
<mat-form-field appearance="outline" class="search-field dense">
  <mat-label>Search</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Type to search..." />
</mat-form-field>
</div>

  <!-- Material Table -->
  <table mat-table [dataSource]="dataSource" >

    <!-- ID Column -->
    <ng-container matColumnDef="process_Category">
      <th mat-header-cell *matHeaderCellDef> Category </th>
      <td mat-cell *matCellDef="let element;let i = index">
        <select
                   [(ngModel)]="element.process_Category"
                    name="process_Category{{i}}"
                     id="ProcessCategory" name="Process_category"
                    class="form-select border-bottom">
                    <option value="0">-- Select --</option>
                    <option *ngFor="let process of ProcessCategory" [ngValue]="process.process_Category">
                        {{process.process_Category}}</option>
                </select>
      </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="employeeID">
      <th mat-header-cell *matHeaderCellDef> Employee ID </th>
      <td mat-cell *matCellDef="let element">{{ element.employeeID }}</td>
    </ng-container>

    <!-- Email Column -->
    <ng-container matColumnDef="userName">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element">{{ element.userName }}</td>
    </ng-container>

    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element">{{ element.isActive }}</td>
    </ng-container>

    

    <ng-container matColumnDef="teamLeadName">
        <th mat-header-cell *matHeaderCellDef> Team Lead </th>
        <td mat-cell *matCellDef="let element">{{ element.teamLeadName }}</td>
    </ng-container>

    <ng-container matColumnDef="managerName">
        <th mat-header-cell *matHeaderCellDef> Manager </th>
        <td mat-cell *matCellDef="let element">{{ element.managerName }}</td>
    </ng-container>

    <ng-container matColumnDef="fun_Manager">
        <th mat-header-cell *matHeaderCellDef> Functional Head </th>
        <td mat-cell *matCellDef="let element">{{ element.fun_Manager }}</td>
    </ng-container>
  
    <ng-container matColumnDef="Edit">
        <th mat-header-cell *matHeaderCellDef> </th>
        <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="onEdit(element)">
                <mat-icon>edit</mat-icon>
            </button>
            <!-- <button mat-icon-button color="primary" (click)="onEdit(element)">
                    <mat-icon>edit</mat-icon>
                </button> -->
        </td>
    </ng-container>

    <!-- Header & Row -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [pageSize]="5"
               [pageSizeOptions]="[5, 10, 25, 100]"
               showFirstLastButtons>
</mat-paginator>
</div>
