<div class="container py-4">
  <!-- app.component.html (or your component template) -->
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-6 g-3">
    <div class="col" *ngFor="let card of cards">
      <div class="card-box p-3 text-white rounded-4 d-flex flex-column justify-content-between"
        [ngStyle]="{'background': card.gradient}" (mouseenter)="onMouseEnter(card.key)" (mouseleave)="onMouseLeave()"
        (click)="onCardClick(card.key)"> <!-- click toggles for touch -->
        <div class="label-class">{{ card.title }}</div>

        <h3 class="mt-2 mb-0 fw-bold d-flex align-items-start">
          <div class="value-wrap">
            {{ card.value }}
            <!-- hover / detail panel -->
            <div class="hover-panel" *ngIf="isPanelVisible(card.key)" (click)="$event.stopPropagation()">
              <table class="table table-borderless mb-0 small">
                <tbody>
                  <tr *ngFor="let item of gridData">
                    <td class="pe-3">{{ item.process_Category }}</td>
                    <td class="text-end">{{ item.totalAssignment }}</td>
                  </tr>
                  <tr *ngIf="!gridData || gridData.length === 0">
                    <td colspan="2" class="text-center text-muted">No details</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </h3>
      </div>
    </div>
  </div>
<div class="container py-4">
  <div id="myGrid" class="ag-theme-quartz" style="width: 100%; height: 600px; overflow-x: auto; ">
    <button (click)="onExport()">⬇️ Download CSV</button>

    <ag-grid-angular class="ag-theme-quartz" [pagination]="true" [paginationPageSize]="100" [rowData]="rowData"
      [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [domLayout]="'autoHeight'" [gridOptions]="gridOptions"
      [pagination]="true" [paginationPageSize]="pageSize" [paginationPageSizeSelector]="pageSizeOptions"
      (paginationChanged)="onPaginationChanged($event)" (gridReady)="onGridReady($event)">
    </ag-grid-angular>



  </div>
  </div>
</div>
