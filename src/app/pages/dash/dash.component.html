<div style="height: 100%; display: flex; flex-direction: column">
      <p style="flex: 0 1 0%">
        Theme:
        <select style="margin-right: 16px" [(ngModel)]="theme">
          <option *ngFor="let theme of themes" [ngValue]="theme.theme">
            {{ theme.label }}
          </option>
        </select>
      </p>
      <div style="flex: 1 1 0%">
        
     
        
      
      </div>
    </div>

<div id="myGrid">
  <ag-grid-angular style="height: 500px;width: 800px;" [columnDefs]="columnDefs" [defaultColDef]="defaultColDef"
    [rowData]="rowData"></ag-grid-angular>
</div>
