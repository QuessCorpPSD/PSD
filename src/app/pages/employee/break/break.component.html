<form autocomplete="off">
<div class="container-fluid">
  <div class="row">
    <div class="d-flex justify-content-between align-items-center  p-2">
      <span></span>
      <!-- <button class="btn btn-danger btn-sm" (click)="isModalVisible = true">Add</button> -->
      <!-- <button mat-raised-button color="primary" (click)="addRow()">
        Add Row
      </button> -->
    </div>
  </div>
  <div  class="table-container">
   <table mat-table [dataSource]="dataSource" class="mat-elevation-z2 w-100">

  <!-- Description -->
  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef>Description</th>
    <td mat-cell *matCellDef="let element; let i = index">
    <select class="form-select"
            [(ngModel)]="element.breakId"
            name="desc{{i}}">     
      <option *ngFor="let item of globalbreak" [ngValue]="item.breakId">
        {{ item.description }}
      </option>
    </select>
  </td>
  </ng-container>

  <!-- Start Time -->
  <ng-container matColumnDef="startTime">
    <th mat-header-cell *matHeaderCellDef>Start Time</th>
    <td mat-cell *matCellDef="let element; let i = index">
      <input
        matInput
        type="time"
        [(ngModel)]="element.startTime"
        name="startTime{{i}}"
      />
    </td>
  </ng-container>

  <!-- End Time -->
  <ng-container matColumnDef="endTime">
    <th mat-header-cell *matHeaderCellDef>End Time</th>
    <td mat-cell *matCellDef="let element; let i = index">
      <input
        matInput
        type="time"
        [(ngModel)]="element.endTime"
        name="endTime{{i}}"
      />
    </td>
  </ng-container>

  <!-- Remarks -->
  <ng-container matColumnDef="remarks">
    <th mat-header-cell *matHeaderCellDef>Remarks</th>
    <td mat-cell *matCellDef="let element; let i = index">
      <input
        matInput
        type="text"
        [(ngModel)]="element.remarks"
        name="remarks{{i}}"
      />
     
    </td>
  </ng-container>

  <!-- Actions (Example: Save / Edit buttons) -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let element; let i = index">
      <button mat-button color="primary" (click)="saveRow(element)" tooltip="Update">
       <svg xmlns="http://www.w3.org/2000/svg"
     width="24"
     height="24"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.8"
     stroke-linecap="round"
     stroke-linejoin="round">

  <!-- Row/List -->
  <line x1="4" y1="6" x2="14" y2="6"/>
  <line x1="4" y1="11" x2="11" y2="11"/>
  <line x1="4" y1="16" x2="9" y2="16"/>

  <!-- Update/Pencil -->
  <path d="M15 5l4 4"/>
  <path d="M13 15l-1 4 4-1 7-7-3-3z"/>
</svg>
      </button>
      <!-- <button mat-button color="primary" (click)="removeRow(i)">
       <mat-icon>delete</mat-icon>
      </button> -->
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

  </div>
</div>
<!-- <div class="btn-container">
  <button mat-raised-button color="primary" (click)="Onsubmit()">
    Submit
  </button>
</div> -->
</form>
