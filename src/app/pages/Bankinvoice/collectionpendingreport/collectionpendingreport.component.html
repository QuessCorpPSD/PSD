<div class="page-wrapper">
    <div class="scrollable-content">
        <mat-card-title class="main-header">
            Collection Pending Report
        </mat-card-title>
        <div class="container py-2">
            <div class="row g-3 align-items-end">

                <div class="col-md-3">
                    <label class="form-label text-muted small">
                        Entity<span class="text-danger">*</span>
                    </label>

                    <div class="dropdown w-100">

                        <button class="form-select form-select-sm text-start" type="button" data-bs-toggle="dropdown">
                            {{ selectedEntityIds.length ? selectedEntityIds.length + ' Selected' : 'Select' }}
                        </button>

                        <div class="dropdown-menu entity-dropdown" data-bs-auto-close="outside">

                            <!-- HEADER -->
                            <div class="entity-header">
                                <button class="btn btn-light btn-sm" (click)="selectAll(); $event.stopPropagation()">
                                    Check All
                                </button>

                                <button class="btn btn-light btn-sm" (click)="unselectAll(); $event.stopPropagation()">
                                    Uncheck All
                                </button>
                            </div>

                            <!-- LIST -->
                            <div class="entity-list">
                                <div *ngFor="let e of EntityList" class="form-check">

                                    <input class="form-check-input" type="checkbox" [value]="e.EntityId"
                                        [checked]="selectedEntityIds.includes(e.EntityId.toString())"
                                        (click)="$event.stopPropagation()" (change)="onEntitySelect($event)">

                                    <label class="form-check-label">
                                        {{ e.EntityName }}
                                    </label>

                                </div>
                            </div>

                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small">Company Code<span class="text-danger">*</span></label>
                    <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
                </div>



                <div class="col-md-3">
                    <label class="form-label text-muted small">
                        Financial Year<span class="text-danger">*</span>
                    </label>

                    <select class="form-select form-select-sm" [(ngModel)]="selectedFinancialYear">
                        <option value="">Select</option>

                        <option *ngFor="let fy of FinancialYearList" [value]="fy.Financial_Year_Id">
                            {{ fy.Financial_Year_Name }}
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">As On Date: <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" [(ngModel)]="startDate" />
                </div>


                <div class="col-md-2 d-flex gap-2">
                    <!-- <button class="btn btn-sm d-flex align-items-center justify-content-center btn-search"
                        matTooltip="Search" (click)="onSearch()">
                        <mat-icon>search</mat-icon>
                    </button> -->
                    <button class="btn btn-secondary btn-sm d-flex align-items-center justify-content-center"
                        matTooltip="export to excel" (click)="exportToExcel()">
                        <mat-icon>download</mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets/Loading.gif" alt="Loading...">
</div>
