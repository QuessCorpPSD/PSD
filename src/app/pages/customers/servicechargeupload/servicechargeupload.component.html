<div class="page-wrapper">
    <div class="scrollable-content">

        <div style="color:#302CB3;font-size:22px;font-family:Montserrat;font-weight:700;padding-top:10px">
            Service Charge Upload
        </div>

        <div class="justify-content-between align-items-center mb-3">
            <div class="container py-3">
                <div class="row g-3 align-items-end">

                    <div class="col-md-3">
                        <label class="form-label text-muted small">Service Charge:</label>
                        <select class="form-select form-select-sm" [(ngModel)]="serviceCharge">
                            <option *ngFor="let s of serviceChargeList" [value]="s.id">{{ s.name }}</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label text-muted small">Service Charge Type:</label>
                        <select class="form-select form-select-sm" [(ngModel)]="serviceChargeType">
                            <option *ngFor="let t of serviceChargeTypeList" [value]="t.id">{{ t.name }}</option>
                        </select>
                    </div>



                    <div class="col-md-4 d-flex gap-2">
                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-search"
                            matTooltip="Import" (click)="importData()">
                            <mat-icon>cloud_upload</mat-icon>
                        </button>

                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-secondary"
                            matTooltip="Download Template" (click)="downloadTemplate()">
                            <mat-icon>cloud_download</mat-icon>
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
