<div class="page-wrapper">
    <div class="scrollable-content">

        <div style="color:#302CB3;font-size:22px;font-family:Montserrat;font-weight:700;padding-top:10px">
            VMS Charge
        </div>

        <div class="justify-content-between align-items-center mb-3">
            <div class="container py-3">

                <div class="row g-3 align-items-end mb-3">
                    <div class="col-md-3">
                        <label class="form-label text-muted small">Company Code</label>
                        <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
                    </div>

                    <div class="col-md-4 d-flex gap-2">
                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-search"
                            matTooltip="Search" (click)="onSearch()">
                            <mat-icon>search</mat-icon>
                        </button>

                        <button class="btn btn-secondary btn-sm d-flex align-items-center justify-content-center"
                            matTooltip="Export to Excel" (click)="exportToExcel()">
                            <mat-icon>download</mat-icon>
                        </button>
                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-primary"
                            matTooltip="Import" (click)="importData()">
                            <mat-icon>cloud_upload</mat-icon>
                        </button>

                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-secondary"
                            matTooltip="Download Template" (click)="downloadTemplate()">
                            <mat-icon>cloud_download</mat-icon>
                        </button>
                    </div>
                </div>
            </div>

            <div class="table-wrapper1" *ngIf="showTable">
                <div class="table-scroll">
                    <mat-table [dataSource]="dataSource.data" class="mat-elevation-z8 custom-table">

                        <ng-container matColumnDef="SNo">
                            <mat-header-cell *matHeaderCellDef>Sl No</mat-header-cell>
                            <mat-cell *matCellDef="let row; let i = index">{{ i + 1 }}</mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="CompanyCode">
                            <mat-header-cell *matHeaderCellDef>Company Code</mat-header-cell>
                            <mat-cell *matCellDef="let row">{{ row.CompanyCode }}</mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="GroupName">
                            <mat-header-cell *matHeaderCellDef>Group Name</mat-header-cell>
                            <mat-cell *matCellDef="let row">{{ row.GroupName }}</mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="VmsType">
                            <mat-header-cell *matHeaderCellDef>Vms Type</mat-header-cell>
                            <mat-cell *matCellDef="let row">{{ row.VmsType }}</mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="VmsCharges">
                            <mat-header-cell *matHeaderCellDef>VmsCharges</mat-header-cell>
                            <mat-cell *matCellDef="let row">{{ row.VmsCharges }}</mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="EffectiveDate">
                            <mat-header-cell *matHeaderCellDef>Effective Date</mat-header-cell>
                            <mat-cell *matCellDef="let row">{{ row.EffectiveDate }}</mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="ProRate">
                            <mat-header-cell *matHeaderCellDef>Pro Rate</mat-header-cell>
                            <mat-cell *matCellDef="let row">{{ row.ProRate }}</mat-cell>
                        </ng-container>

                        <mat-header-row *matHeaderRowDef="uploadDisplayedColumns"></mat-header-row>
                        <mat-row *matRowDef="let row; columns: uploadDisplayedColumns;" (click)="onRowSelect(row)"
                            [class.selected-row]="selectedRow === row"></mat-row>

                    </mat-table>
                </div>

                <div *ngIf="dataSource.data.length === 0" class="text-center p-4">
                    <p class="text-muted">No data to display</p>
                </div>

                <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
            </div>
        </div>
    </div>
</div>
