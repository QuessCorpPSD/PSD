<div class="page-wrapper">
    <div class="scrollable-content">

        <div style="color:#302CB3;font-size:22px;font-family:Montserrat;font-weight:700;padding-top:10px">
            Job Category
        </div>

        <div class="justify-content-between align-items-center mb-3">
            <div class="container py-3">
                <div class="row g-3 align-items-end">

                    <div class="col-md-3">
                        <label class="form-label text-muted small">Job Category</label>
                        <input type="text" class="form-control form-control-sm"
                            [(ngModel)]="jobCategorySearch" />
                    </div>

                    <div class="col-md-4 d-flex gap-2">
                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-search"
                            matTooltip="Search" (click)="onsearch()">
                            <mat-icon>search</mat-icon>
                        </button>

                        <button class="btn btn-secondary btn-sm d-flex align-items-center justify-content-center"
                            matTooltip="Export to Excel" (click)="exportToExcel()">
                            <mat-icon>download</mat-icon>
                        </button>

                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-success"
                            matTooltip="Add" (click)="openadd()">
                            <mat-icon>add</mat-icon>
                        </button>
                    </div>

                </div>
            </div>

        

            <div class="table-wrapper1" *ngIf="showTable">
                <div class="table-scroll">
                    <mat-table [dataSource]="dataSource" class="mat-elevation-z8 custom-table">

                        <ng-container matColumnDef="Action">
                            <mat-header-cell *matHeaderCellDef>Action</mat-header-cell>
                            <mat-cell *matCellDef="let row">
                                <div class="action-buttons">
                                    <button class="btn btn-sm" matTooltip="Edit" (click)="editJobCategory(row)">
                                        <mat-icon>edit</mat-icon>
                                    </button>
                                    <button class="btn btn-sm" matTooltip="Delete" (click)="deleteJobCategory(row)">
                                        <mat-icon>delete</mat-icon>
                                    </button>
                                </div>
                            </mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="SNo">
                            <mat-header-cell *matHeaderCellDef>SNo</mat-header-cell>
                            <mat-cell *matCellDef="let row; let i = index">{{ i + 1 }}</mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="JobCategory">
                            <mat-header-cell *matHeaderCellDef>JOB_Category</mat-header-cell>
                            <mat-cell *matCellDef="let row">{{ row.JobCategory }}</mat-cell>
                        </ng-container>

                        <mat-header-row *matHeaderRowDef="uploadDisplayedColumns"></mat-header-row>
                        <mat-row *matRowDef="let row; columns: uploadDisplayedColumns;"
                                 (click)="onRowSelect(row)"
                                 [class.selected-row]="selectedRow === row"></mat-row>

                    </mat-table>
                </div>

                <div *ngIf="dataSource.data.length === 0" class="text-center p-4">
                    <p class="text-muted">No data to display</p>
                </div>

                <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
            </div>
        </div>
    </div>
</div>

<div *ngIf="showJobPopup" class="popup-overlay">
    <form [formGroup]="jobForm" novalidate>
        <mat-card class="popup-card">

            <mat-card-header class="popup-header">
                <mat-card-title>
                    {{ isEditMode ? 'Edit Jobcategoryservice' : 'Add Jobcategoryservice' }}
                </mat-card-title>
                <span class="spacer"></span>
                <button mat-icon-button type="button" style="background:transparent;border:none" (click)="closePopup()">
                    <mat-icon>close</mat-icon>
                </button>
            </mat-card-header>

            <mat-card-content>
                <div class="row g-3 mb-3">

                    <div class="col-md-12">
                        <label class="form-label text-muted small">
                            Job Category: <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control form-control-sm" formControlName="jobCategory" />
                        <small class="text-danger d-block"
                            *ngIf="showErrors && jobForm.get('jobCategory')?.invalid">
                            Job Category is required
                        </small>
                    </div>

                </div>
            </mat-card-content>

            <mat-card-footer class="popup-footer">
                <button type="button" class="btn-save" (click)="saveJobCategory()">
                    {{ isEditMode ? 'Update' : 'Save' }}
                </button>
                <button type="button" class="btn-cancel" (click)="closePopup()">Cancel</button>
            </mat-card-footer>

        </mat-card>
    </form>
</div>
