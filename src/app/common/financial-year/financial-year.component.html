<mat-form-field class="w-100 custom-height rounded-4" appearance="outline" style="background-color: white;height:30px;">

  <input type="text" matInput  style="color: #222;font-family: nunito sans; font-size: 12px; font-weight: 500;" [formControl]="myControl" placeholder="Search Financial Year"
    [matAutocomplete]="auto" />
  <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn"
    (optionSelected)="onOptionSelected($event.option.value)">
    <mat-option *ngFor="let option of filteredOptions$ | async" [value]="option" style="font-size: 11px;line-height: 20px;">
      {{ option.financial_Year_Name }}
    </mat-option>
  </mat-autocomplete>
</mat-form-field>
