<mat-form-field class="w-100 custom-height rounded-4" appearance="outline" style="background-color: white;height:30px;">
  <input style="color: #222;font-family: Montserrat; font-size: 12px; font-weight: 500;"
    type="text"
    matInput
    [formControl]="myControl" placeholder="Select Location"
    [matAutocomplete]="auto"
  />
  <mat-autocomplete
    #auto="matAutocomplete"
    [displayWith]="displayFn"
    (optionSelected)="onOptionSelected($event.option.value)">

    <mat-option *ngFor="let city of filteredOptions$ | async" [value]="city">
      {{ city.city_Name }}
    </mat-option>

  </mat-autocomplete>
</mat-form-field>
