<mat-form-field  class="w-100 custom-height rounded-4" appearance="outline">
  
  <input style="color: #222;font-family: nunito sans; font-size: 12px; font-weight: 500;"
    type="text"
    matInput
    [formControl]="myControl" placeholder="Search TeamLeader"
    [matAutocomplete]="auto"
  />
  <mat-autocomplete
    #auto="matAutocomplete"
    [displayWith]="displayFn"
    (optionSelected)="onOptionSelected($event.option.value)"
  >
    <mat-option 
      *ngFor="let option of filteredOptions$ | async"
      [value]="option"
    >
      {{ option.userName }}
    </mat-option>
  </mat-autocomplete>
</mat-form-field>
